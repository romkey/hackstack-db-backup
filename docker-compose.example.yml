services:
  dbbackup:
    image: ghcr.io/romkey/hackstack-db-backup:latest
    hostname: dbbackup
    container_name: dbbackup
    restart: unless-stopped
    user: "${BACKUP_UID:-0}:${BACKUP_GID:-0}"
    volumes:
      - /opt:/opt:ro
      - backup_nfs:/dest
    networks:
      - backup-net
    env_file:
      - .env
    # Optional age encryption. Uncomment to supply recipient PUBLIC keys via a
    # secret instead of BACKUP_ENCRYPTION_RECIPIENTS in .env. The private key
    # belongs offline, never on this host.
    # environment:
    #   BACKUP_ENCRYPTION_RECIPIENTS_FILE: /run/secrets/age-recipients
    # secrets:
    #   - age-recipients

# secrets:
#   age-recipients:
#     file: ./age-recipients.txt

volumes:
  backup_nfs:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NFS_SERVER},${NFS_OPTIONS:-nfsvers=4,soft,rw}
      device: ":${NFS_PATH}"

networks:
  backup-net:
    name: dbbackup-net
